<!-- templates/main/thank_you.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Sent — Noor Fatima</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #F7F4EF;
            --text-primary: #4B3A33;
            --accent: #D4B98C;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
        }
        .serif {
            font-family: 'Playfair Display', serif;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6">

    <div class="bg-white bg-opacity-40 backdrop-blur-md rounded-3xl shadow-2xl p-10 md:p-16 max-w-xl text-center border border-[#E8D7CE]">
        <!-- Success Icon -->
        <div class="flex items-center justify-center mb-8">
            <div class="p-5 bg-gradient-to-br from-[#D4B98C] to-[#4B3A33] rounded-full shadow-lg">
                <svg class="w-12 h-12 text-white" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                </svg>
            </div>
        </div>

        <!-- Content -->
        <h1 class="serif text-4xl md:text-5xl font-bold mb-4 tracking-tight">Message Received.</h1>
        <p class="text-lg opacity-80 mb-10 leading-relaxed">
            Thank you for reaching out. Your message has been securely sent, and I'll get back to you as soon as possible.
        </p>

        <!-- Action -->
        <div class="flex flex-col sm:flex-row justify-center gap-4">
            <a href="{% url 'home' %}" 
               class="bg-[#4B3A33] text-white font-bold px-8 py-4 rounded-full shadow-xl hover:bg-[#3A2D2A] transition duration-300 transform hover:scale-105">
                Return to Home
            </a>
            <a href="https://github.com/noorfattiimaa" target="_blank"
               class="border-2 border-[#D4B98C] text-[#4B3A33] font-bold px-8 py-4 rounded-full hover:bg-[#F3E9E2] transition duration-300 transform hover:scale-105">
                Visit GitHub
            </a>
        </div>
    </div>

</body>
</html>
